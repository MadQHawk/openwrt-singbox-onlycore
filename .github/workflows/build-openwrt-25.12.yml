name: Build OpenWrt 25.12.5 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Makefile
      - htdocs/**
      - root/**
      - .github/workflows/build-openwrt-25.12.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify OpenWrt SDK
        run: |
          SDK_URL='https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          curl --fail --location --retry 3 "$SDK_URL" --output "$RUNNER_TEMP/openwrt-sdk.tar.zst"
          echo '0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c  '"$RUNNER_TEMP/openwrt-sdk.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"

      - name: Register package and compile
        run: |
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk"
          PACKAGE_DIR="$RUNNER_TEMP/luci-app-singbox-lite"
          cd "$SDK_DIR"
          mkdir -p "$PACKAGE_DIR" package/feeds/local
          cp "$GITHUB_WORKSPACE/Makefile" "$GITHUB_WORKSPACE/README.md" "$PACKAGE_DIR/"
          cp -a "$GITHUB_WORKSPACE/htdocs" "$GITHUB_WORKSPACE/root" "$PACKAGE_DIR/"
          ln -s "$PACKAGE_DIR" package/feeds/local/luci-app-singbox-lite
          ./scripts/feeds update luci
          ./scripts/feeds install -p luci luci-base
          make defconfig
          make package/feeds/local/luci-app-singbox-lite/compile V=s
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/packages -type f -name 'luci-app-singbox-lite*.apk' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" +
          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -type f -name '*.apk' -print -quit)"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-singbox-lite-openwrt-25.12.5-x86-64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
