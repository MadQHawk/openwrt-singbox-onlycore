name: Build OpenWrt 25.12.5 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Makefile
      - htdocs/**
      - root/**
      - .github/workflows/build-openwrt-25.12.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify OpenWrt SDK
        run: |
          SDK_URL='https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          curl --fail --location --retry 3 "$SDK_URL" --output "$RUNNER_TEMP/openwrt-sdk.tar.zst"
          echo '0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c  '"$RUNNER_TEMP/openwrt-sdk.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"

      - name: Register package and compile
        run: |
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk"
          PACKAGE_NAME="luci-app-singbox-lite"
          LOCAL_FEED_DIR="$RUNNER_TEMP/local-feed"
          PACKAGE_DIR="$LOCAL_FEED_DIR/$PACKAGE_NAME"
          cd "$SDK_DIR"
          mkdir -p "$PACKAGE_DIR"
          cp "$GITHUB_WORKSPACE/Makefile" "$GITHUB_WORKSPACE/README.md" "$PACKAGE_DIR/"
          cp -a "$GITHUB_WORKSPACE/htdocs" "$GITHUB_WORKSPACE/root" "$PACKAGE_DIR/"
          echo "src-link custom $LOCAL_FEED_DIR" >> feeds.conf.default
          ./scripts/feeds update custom
          if ! grep -q "^Package: $PACKAGE_NAME$" feeds/custom.index; then
            echo "::error::The SDK feed scanner did not index $PACKAGE_NAME."
            exit 1
          fi
          ./scripts/feeds install -p custom "$PACKAGE_NAME"
          echo "CONFIG_PACKAGE_$PACKAGE_NAME=m" >> .config
          make defconfig
          if ! grep -q "^CONFIG_PACKAGE_$PACKAGE_NAME=m$" .config; then
            echo "::error::CONFIG_PACKAGE_$PACKAGE_NAME was not generated."
            grep -n 'singbox-lite' tmp/.config-package.in || true
            exit 1
          fi
          make "package/feeds/custom/$PACKAGE_NAME/compile" V=s
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          shopt -s nullglob
          APK_FILES=(bin/packages/*/custom/luci-app-singbox-lite*.apk)
          if (( ${#APK_FILES[@]} == 0 )); then
            echo "::error::No luci-app-singbox-lite APK was produced."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${APK_FILES[@]}" "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-singbox-lite-openwrt-25.12.5-x86-64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
